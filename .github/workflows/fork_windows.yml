name: Fork Windows
run-name: Fork Windows ${{ inputs.source_ref || github.head_ref || github.ref_name }} (${{ github.event_name }}, attempt ${{ github.run_attempt }})

on:
  pull_request:
  push:
    branches: [main, ci/fork-windows-releases]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Repository branch, tag, or commit to build
        type: string
        default: main
      create_release:
        description: Create a draft prerelease after every required check
        type: boolean
        default: false
      release_tag:
        description: New fork-YYYY.MM.DD.N tag (required for release)
        type: string
        default: ''
      use_cache:
        description: Enable compatible Qt, dependency-archive and compiler-object caches on trusted runs
        type: boolean
        default: true
      diagnostic_runtime_profile:
        description: Runtime-only replay profile; never qualifies a source or release
        type: choice
        default: none
        options:
          - none
          - musesounds-update-disabled
          - musesounds-update-test-mode

permissions:
  contents: read

concurrency:
  # Distinct manual builds stay separate even when they name the same source ref (GitHub keeps
  # only one pending run per group), a release is serialised on its tag without cancelling an
  # active one, and superseded pull request runs are cancelled.
  group: >-
    ${{ github.workflow }}-${{
      (github.event_name == 'workflow_dispatch' && inputs.create_release)
        && format('release-{0}', inputs.release_tag)
        || (github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id))
        || (github.event_name == 'pull_request' && format('pr-{0}', github.ref))
        || format('push-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    if: github.repository == 'tbui17/MuseScore'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      framework_sha: ${{ steps.source.outputs.framework_sha }}
      framework_url: ${{ steps.source.outputs.framework_url }}
      workflow_sha: ${{ steps.source.outputs.workflow_sha }}
      requested_source_ref: ${{ steps.source.outputs.requested_source_ref }}
      effective_use_cache: ${{ steps.source.outputs.effective_use_cache }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: pipeline
          persist-credentials: false
      - name: Lint workflow with verified actionlint
        working-directory: pipeline
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/fork_windows.yml .github/workflows/check_submodules.yml .github/workflows/check_unit_tests.yml .github/workflows/check_testflow_gui.yml
      - name: Validate trusted helper contracts
        run: python3 -m unittest discover -s pipeline/buildscripts/ci/fork/tests -p 'test_*.py' -v
      - name: Validate Windows helper suites before an expensive build
        working-directory: pipeline
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -eq [version]'5.7.1' })) {
            Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion 5.7.1
          $result = Invoke-Pester -Path buildscripts/ci/fork/tests -CI -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) fork helper test(s) failed" }
      - name: Resolve source once and verify fork submodule
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          CREATE_RELEASE: ${{ inputs.create_release }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          USE_CACHE: ${{ inputs.use_cache }}
        run: python3 pipeline/buildscripts/ci/fork/pipeline.py preflight --source source --output provenance/provenance.json
      - name: Exercise dependency failure boundaries
        working-directory: source/muse
        run: cmake -P buildscripts/cmake/deps/tests/run-tests.cmake
      - uses: actions/upload-artifact@v7
        with:
          name: source-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: provenance/provenance.json
          if-no-files-found: error
          retention-days: 14

  windows:
    if: inputs.diagnostic_runtime_profile == '' || inputs.diagnostic_runtime_profile == 'none'
    needs: preflight
    runs-on: windows-2025
    timeout-minutes: 240
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.workflow_sha }}
          path: pipeline
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          path: source
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: source-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: provenance
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.2
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat qtnetworkauth qtshadertools qtwebsockets
          cache-key-prefix: qt-v1-win-x64-qt6.10.2-modules-qt5compat-qtnetworkauth-qtshadertools-qtwebsockets
          cache: ${{ needs.preflight.outputs.effective_use_cache == 'true' }}
      - name: Prove native build failure propagation
        working-directory: pipeline
        shell: pwsh
        env:
          MUSE_FORK_REQUIRE_NATIVE_TOOLCHAIN: "1"
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -eq [version]'5.7.1' })) {
            Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion 5.7.1
          $result = Invoke-Pester -Path buildscripts/ci/fork/tests/windows-build.tests.ps1 -CI -Output Detailed -PassThru
          if ($result.TotalCount -le 0) { throw "windows-build Pester discovery returned no tests" }
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) windows-build test(s) failed" }
          if ($result.SkippedCount -gt 0) { throw "$($result.SkippedCount) windows-build test(s) were skipped although the hosted toolchain must be present" }
      - name: Provision pinned ccache
        if: needs.preflight.outputs.effective_use_cache == 'true'
        shell: pwsh
        env:
          CCACHE_URL: https://github.com/ccache/ccache/releases/download/v4.14/ccache-4.14-windows-x86_64.zip
          CCACHE_SHA256: 2568347a697e103ca1b073981c704ad76fb2507d066c38dba038dd73399d968f
          CCACHE_VERSION: 4.14
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ccache-$env:CCACHE_VERSION-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.zip"
          Invoke-WebRequest -Uri $env:CCACHE_URL -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:CCACHE_SHA256) {
            throw "ccache archive SHA-256 mismatch: expected $env:CCACHE_SHA256, got $actual"
          }
          $extract = Join-Path $env:RUNNER_TEMP "ccache-$env:CCACHE_VERSION-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $bin = Join-Path $extract "ccache-$env:CCACHE_VERSION-windows-x86_64"
          $ccache = Join-Path $bin "ccache.exe"
          if (-not (Test-Path -LiteralPath $ccache -PathType Leaf)) {
            throw "Pinned ccache archive did not contain $ccache"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          $reportedOutput = & $ccache --version 2>&1 | Out-String
          $reportedExitCode = $LASTEXITCODE
          $reported = $reportedOutput.Trim()
          $reportedMatch = [regex]::Match($reportedOutput, '(?im)^\s*ccache version (?<version>\d+(?:\.\d+)+)\s*$')
          $reportedVersion = if ($reportedMatch.Success) { $reportedMatch.Groups["version"].Value } else { "" }
          if ($reportedExitCode -ne 0 -or -not $reportedMatch.Success -or $reportedVersion -ne $env:CCACHE_VERSION) {
            throw "Pinned ccache reported an unexpected version (exit $reportedExitCode): $reported"
          }
          Write-Host "Pinned ccache $reportedVersion from verified $archive"
      - name: Prove pinned ccache MSVC PCH support
        if: needs.preflight.outputs.effective_use_cache == 'true'
        shell: pwsh
        working-directory: pipeline
        run: |
          & pwsh -NoProfile -NonInteractive -File buildscripts/ci/fork/tests/ccache-pch-probe.ps1 `
            -CcacheDirectory ../build-output/ccache `
            -LogDirectory ../build-output/logs
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned ccache MSVC PCH probe failed with exit code $LASTEXITCODE"
          }
      - name: Resolve cache identity from native toolchain
        id: cache_identity
        if: needs.preflight.outputs.effective_use_cache == 'true'
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          SOURCE_REF: ${{ needs.preflight.outputs.requested_source_ref }}
          WORKFLOW_SHA: ${{ needs.preflight.outputs.workflow_sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $helper = "./pipeline/buildscripts/ci/fork/windows-build.ps1"
          $helperArgs = @(
            "-SourceDirectory", "./source",
            "-OutputDirectory", "./build-output",
            "-ProvenancePath", "./provenance/provenance.json",
            "-SourceSha", $env:SOURCE_SHA,
            "-SourceRef", $env:SOURCE_REF,
            "-BuildNumber", $env:BUILD_NUMBER,
            "-UseCache",
            "-CcacheDirectory", "./build-output/ccache",
            "-CacheIdentityOnly"
          )
          $identityOutput = & pwsh -NoProfile -NonInteractive -File $helper @helperArgs
          $identityExitCode = $LASTEXITCODE
          $json = @($identityOutput | Select-Object -Last 1)
          if ($identityExitCode -ne 0) {
            throw "Cache identity helper failed with exit code $identityExitCode"
          }
          if ($json.Count -ne 1) {
            throw "Cache identity helper did not emit exactly one JSON result"
          }
          $identity = $json[0] | ConvertFrom-Json
          foreach ($name in @("ccache_key", "ccache_restore_prefix", "deps_key", "qt_cache_prefix")) {
            $value = [string]$identity.$name
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Cache identity did not provide '$name'"
            }
            Add-Content -Path $env:GITHUB_OUTPUT -Value "$name=$value"
          }
      - name: Restore compiler object cache
        id: ccache_cache
        if: needs.preflight.outputs.effective_use_cache == 'true'
        uses: actions/cache/restore@v4
        with:
          path: build-output/ccache
          key: ${{ steps.cache_identity.outputs.ccache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.cache_identity.outputs.ccache_restore_prefix }}
      - name: Restore verified dependency archives
        id: deps_cache
        if: needs.preflight.outputs.effective_use_cache == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            source/build.release/_deps/**/.pinned/[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]
          key: ${{ steps.cache_identity.outputs.deps_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.cache_identity.outputs.deps_key }}-
      - name: Record cache restore provenance
        if: needs.preflight.outputs.effective_use_cache == 'true'
        shell: pwsh
        env:
          CCACHE_CACHE_MATCHED_KEY: ${{ steps.ccache_cache.outputs.cache-matched-key }}
          DEPS_CACHE_MATCHED_KEY: ${{ steps.deps_cache.outputs.cache-matched-key }}
          QT_CACHE_KEY_PREFIX: qt-v1-win-x64-qt6.10.2-modules-qt5compat-qtnetworkauth-qtshadertools-qtwebsockets
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "CCACHE_CACHE_MATCHED_KEY=$env:CCACHE_CACHE_MATCHED_KEY"
          Add-Content -Path $env:GITHUB_ENV -Value "DEPS_CACHE_MATCHED_KEY=$env:DEPS_CACHE_MATCHED_KEY"
          Add-Content -Path $env:GITHUB_ENV -Value "QT_CACHE_KEY_PREFIX=$env:QT_CACHE_KEY_PREFIX"
      - name: Full desktop configure, compile and install
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          SOURCE_REF: ${{ needs.preflight.outputs.requested_source_ref }}
          WORKFLOW_SHA: ${{ needs.preflight.outputs.workflow_sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $helperArgs = @(
            "-SourceDirectory", "./source",
            "-OutputDirectory", "./build-output",
            "-ProvenancePath", "./provenance/provenance.json",
            "-SourceSha", $env:SOURCE_SHA,
            "-SourceRef", $env:SOURCE_REF,
            "-BuildNumber", $env:BUILD_NUMBER
          )
          if ("${{ needs.preflight.outputs.effective_use_cache }}" -eq "true") {
            $helperArgs += @("-UseCache", "-CcacheDirectory", "./build-output/ccache")
          }
          & pwsh -NoProfile -NonInteractive -File ./pipeline/buildscripts/ci/fork/windows-build.ps1 @helperArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Windows build helper failed with exit code $LASTEXITCODE"
          }
      - name: Save compiler object cache
        if: >-
          needs.preflight.outputs.effective_use_cache == 'true' &&
          success() &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: build-output/ccache
          key: ${{ steps.cache_identity.outputs.ccache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save verified dependency archives
        if: >-
          needs.preflight.outputs.effective_use_cache == 'true' &&
          success() &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: |
            source/build.release/_deps/**/.pinned/[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]
          key: ${{ steps.cache_identity.outputs.deps_key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate and archive installed application
        shell: pwsh
        run: ./pipeline/buildscripts/ci/fork/package-windows.ps1 -SourceDirectory ./source -InstallDirectory ./build-output/install -OutputDirectory ./package -ProvenancePath ./provenance/provenance.json
      - name: Upload validated binary package
        id: package
        uses: actions/upload-artifact@v7
        with:
          name: windows-candidate-${{ needs.preflight.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            package/*.zip
            package/build-manifest.json
            package/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload diagnostics, not a release package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-output/logs
            source/build.release/CMakeFiles/CMakeConfigureLog.yaml
            source/build.release/CMakeCache.txt
            source/build.release/install_manifest.txt
          if-no-files-found: ignore
          retention-days: 14

  units:
    if: inputs.diagnostic_runtime_profile == '' || inputs.diagnostic_runtime_profile == 'none'
    needs: preflight
    uses: ./.github/workflows/check_unit_tests.yml
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      code_coverage: false

  runtime:
    if: inputs.diagnostic_runtime_profile == '' || inputs.diagnostic_runtime_profile == 'none'
    needs: [preflight, windows]
    runs-on: windows-2025
    # Three GUI cases and four probes each have the helper's 600s bound; leave collection time after
    # that 70-minute worst case instead of letting the job cancel during TC15.
    timeout-minutes: 90
    steps:
      # Trusted helper only: the runtime job never runs build code from the source checkout.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.workflow_sha }}
          path: pipeline
          sparse-checkout: buildscripts/ci/fork
          persist-credentials: false
      # Reviewed fixtures only, not a compilable source tree: a full checkout beside the
      # extracted package could let the application fall back to source resources and mask a
      # missing packaged file. Only the files the runtime helper reads from -SourceDirectory are
      # present (the two mandatory GUI scripts, the optional TC15 fixture and one committed score),
      # while .git still keeps HEAD equal to source_sha for the manifest cross-check.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          path: fixtures
          sparse-checkout: |
            /version.cmake
            /share/testflowscripts/TC11_CommandPaletteDialog.js
            /share/testflowscripts/TC14_CommandPaletteAnnounce.js
            /share/testflowscripts/TC15_RegionEntryAnnounce.js
            /vtest/scores/layout-5.mscx
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact_id }}
          path: package
          merge-multiple: true
      - name: Test extracted package without development Qt
        shell: pwsh
        env:
          MUSE_EXPECTED_WORKFLOW_SHA: ${{ needs.preflight.outputs.workflow_sha }}
          MUSE_EXPECTED_FRAMEWORK_SHA: ${{ needs.preflight.outputs.framework_sha }}
        run: ./pipeline/buildscripts/ci/fork/test-windows-package.ps1 -ArtifactDirectory ./package -SourceDirectory ./fixtures -OutputDirectory './runtime results'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # Diagnostics only: the extraction tree and the rest of the isolated profile are not uploaded;
          # the helper may retain only fresh app logs and the seeded test settings under this directory.
          name: diagnostic-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime results/logs
          if-no-files-found: ignore
          retention-days: 14

  diagnostic_runtime:
    if: >-
      github.repository == 'tbui17/MuseScore' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.diagnostic_runtime_profile == 'musesounds-update-disabled' ||
       inputs.diagnostic_runtime_profile == 'musesounds-update-test-mode')
    needs: preflight
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.workflow_sha }}
          path: pipeline
          sparse-checkout: buildscripts/ci/fork
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          path: fixtures
          sparse-checkout: |
            /version.cmake
            /share/testflowscripts/TC11_CommandPaletteDialog.js
            /share/testflowscripts/TC14_CommandPaletteAnnounce.js
            /share/testflowscripts/TC15_RegionEntryAnnounce.js
            /vtest/scores/layout-5.mscx
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download exact package from diagnostic source run
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 10405214616
          github-token: ${{ github.token }}
          repository: tbui17/MuseScore
          run-id: 34989534823
          path: package
          merge-multiple: true
      - name: Record isolated diagnostic harness delta
        shell: pwsh
        env:
          EXPECTED_PACKAGE_SHA256: 6a0a16ca4d63cc79c6ef797b93820564875ae39085b20486e5b79c9449aaa4a9
          EXPECTED_SOURCE_SHA: de6b09e5d0ca500eb413ef03862242d2a03decd8
          EXPECTED_FRAMEWORK_SHA: 54b1ab3353365c1d84119c8e1cd450c2a9e7bf80
          DIAGNOSTIC_PROFILE: ${{ inputs.diagnostic_runtime_profile }}
        run: |
          $manifest = Get-Content -LiteralPath package/build-manifest.json -Raw | ConvertFrom-Json
          $zip = @(Get-ChildItem -LiteralPath package -Filter '*.zip' -File)
          if ($zip.Count -ne 1) { throw "expected exactly one package zip, found $($zip.Count)" }
          $packageSha = (Get-FileHash -LiteralPath $zip[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($packageSha -ne $env:EXPECTED_PACKAGE_SHA256) { throw "package SHA-256 mismatch: $packageSha" }
          if ($manifest.package.sha256 -ne $env:EXPECTED_PACKAGE_SHA256) { throw "manifest package SHA-256 mismatch" }
          if ($manifest.source_sha -ne $env:EXPECTED_SOURCE_SHA) { throw "manifest source SHA mismatch" }
          if ($manifest.framework_sha -ne $env:EXPECTED_FRAMEWORK_SHA) { throw "manifest framework SHA mismatch" }
          $tc15 = 'fixtures/share/testflowscripts/TC15_RegionEntryAnnounce.js'
          [ordered]@{
            diagnostic_only = $true
            exact_source_qualification = $false
            origin_run_id = '34989534823'
            origin_artifact_id = '10405214616'
            package_sha256 = $packageSha
            source_sha = $manifest.source_sha
            framework_sha = $manifest.framework_sha
            workflow_sha = '${{ needs.preflight.outputs.workflow_sha }}'
            tc15_sha256 = (Get-FileHash -LiteralPath $tc15 -Algorithm SHA256).Hash.ToLowerInvariant()
            positive_control_script_sha256 = if ($env:DIAGNOSTIC_PROFILE -eq 'musesounds-update-test-mode') {
              (Get-FileHash -LiteralPath 'pipeline/buildscripts/ci/fork/TC_MuseSoundsUpdateTestModeControl.js' -Algorithm SHA256).Hash.ToLowerInvariant()
            } else {
              $null
            }
            dialog_monitor_sha256 = if ($env:DIAGNOSTIC_PROFILE -eq 'musesounds-update-test-mode') {
              (Get-FileHash -LiteralPath 'pipeline/buildscripts/ci/fork/watch-musesounds-dialog.ps1' -Algorithm SHA256).Hash.ToLowerInvariant()
            } else {
              $null
            }
            profile_delta = if ($env:DIAGNOSTIC_PROFILE -eq 'musesounds-update-test-mode') {
              [ordered]@{
                section = 'musesounds'
                checkForUpdate = $true
                checkForUpdateTestMode = $true
              }
            } else {
              [ordered]@{
                section = 'musesounds'
                checkForUpdate = $false
              }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath diagnostic-harness-delta.json -Encoding utf8NoBOM
      - name: Replay package with MuseSounds update check disabled
        if: inputs.diagnostic_runtime_profile == 'musesounds-update-disabled'
        shell: pwsh
        env:
          MUSE_EXPECTED_WORKFLOW_SHA: de6b09e5d0ca500eb413ef03862242d2a03decd8
          MUSE_EXPECTED_FRAMEWORK_SHA: 54b1ab3353365c1d84119c8e1cd450c2a9e7bf80
        run: >-
          ./pipeline/buildscripts/ci/fork/test-windows-package.ps1
          -ArtifactDirectory ./package
          -SourceDirectory ./fixtures
          -OutputDirectory './runtime results'
          -DisableMuseSoundsUpdateCheck
      - name: Replay deterministic MuseSounds update test-mode control
        if: inputs.diagnostic_runtime_profile == 'musesounds-update-test-mode'
        shell: pwsh
        env:
          MUSE_EXPECTED_WORKFLOW_SHA: de6b09e5d0ca500eb413ef03862242d2a03decd8
          MUSE_EXPECTED_FRAMEWORK_SHA: 54b1ab3353365c1d84119c8e1cd450c2a9e7bf80
        run: |
          $evidencePath = Join-Path $PWD 'musesounds-dialog-evidence.json'
          $monitorScript = Join-Path $PWD 'pipeline/buildscripts/ci/fork/watch-musesounds-dialog.ps1'
          $monitor = Start-Process -FilePath pwsh -PassThru -ArgumentList @(
            '-NoProfile', '-NonInteractive', '-File', $monitorScript,
            '-EvidencePath', $evidencePath)

          & ./pipeline/buildscripts/ci/fork/test-windows-package.ps1 `
            -ArtifactDirectory ./package `
            -SourceDirectory ./fixtures `
            -OutputDirectory './runtime results' `
            -MuseSoundsUpdateTestMode `
            -DiagnosticTestScript ./pipeline/buildscripts/ci/fork/TC_MuseSoundsUpdateTestModeControl.js
          $helperExit = $LASTEXITCODE

          if (-not $monitor.WaitForExit(45000)) {
            Stop-Process -Id $monitor.Id -Force
            throw 'targeted MuseSounds dialog monitor did not finish'
          }
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
            throw 'targeted MuseSounds dialog monitor wrote no evidence'
          }
          $dialogEvidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          if ($monitor.ExitCode -ne 0 -or -not $dialogEvidence.opened -or
              -not $dialogEvidence.settled -or -not $dialogEvidence.close_invoked -or
              -not $dialogEvidence.closed -or
              -not [string]::IsNullOrEmpty([string]$dialogEvidence.error)) {
            throw "targeted MuseSounds dialog control failed: $($dialogEvidence | ConvertTo-Json -Compress)"
          }
          if ($helperExit -ne 0) { throw "runtime helper failed with exit code $helperExit" }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostic-runtime-${{ inputs.diagnostic_runtime_profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime results/logs
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostic-harness-delta-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostic-harness-delta.json
            musesounds-dialog-evidence.json
          if-no-files-found: error
          retention-days: 14

  readiness:
    name: Fork Windows readiness
    # Same fork guard as preflight: an upstream run must not gain a failing status from a
    # workflow whose jobs are all skipped there. Inside the fork it still runs on failure.
    if: >-
      github.repository == 'tbui17/MuseScore' &&
      always() &&
      (inputs.diagnostic_runtime_profile == '' || inputs.diagnostic_runtime_profile == 'none')
    needs: [preflight, windows, units, runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Require every mandatory job to succeed
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          WINDOWS: ${{ needs.windows.result }}
          UNITS: ${{ needs.units.result }}
          RUNTIME: ${{ needs.runtime.result }}
        run: |
          test "$PREFLIGHT" = success
          test "$WINDOWS" = success
          test "$UNITS" = success
          test "$RUNTIME" = success

  release:
    if: github.repository == 'tbui17/MuseScore' && github.event_name == 'workflow_dispatch' && inputs.create_release && github.ref == 'refs/heads/main'
    needs: [preflight, windows, units, runtime, readiness]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: fork-draft-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.workflow_sha }}
          path: pipeline
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact_id }}
          path: package
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: source-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: provenance
      - name: Verify and create draft from tested bytes
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          CREATE_RELEASE: ${{ inputs.create_release }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 pipeline/buildscripts/ci/fork/pipeline.py release --artifacts package --provenance provenance/provenance.json
