name: 'Check: Submodules'

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_muse_framework:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify allowed URL and exact recursive checkout
        env:
          REPOSITORY: ${{ github.repository }}
        run: python3 buildscripts/ci/fork/pipeline.py submodule --source . --repository "$REPOSITORY"
