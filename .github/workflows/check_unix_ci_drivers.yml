name: 'Check: Unix CI drivers'

on:
  pull_request:
    paths:
      - 'buildscripts/ci/linux/build.sh'
      - 'buildscripts/ci/macos/build.sh'
      - 'buildscripts/ci/fork/tests/test_unix_build_drivers.py'
      - '.github/workflows/check_unix_ci_drivers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  driver_contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate shell syntax
        run: |
          /bin/bash -n buildscripts/ci/linux/build.sh
          /bin/bash -n buildscripts/ci/macos/build.sh
      - name: Exercise production drivers with bounded build stubs
        env:
          MUSE_TEST_BASH: /bin/bash
        run: |
          python3 - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover(
              "buildscripts/ci/fork/tests", pattern="test_unix_build_drivers.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun == 0 or result.skipped or not result.wasSuccessful():
              sys.exit(1)
          PY
