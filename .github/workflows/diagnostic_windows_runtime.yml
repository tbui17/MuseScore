name: Diagnostic Windows Runtime

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful-package or failed-runtime run containing the immutable package artifact
        required: true
        type: string
        default: '34839199756'
      artifact_id:
        description: Immutable windows-candidate artifact ID from run_id
        required: true
        type: string
        default: '10346284048'
      source_sha:
        description: Source fixture commit that produced the package
        required: true
        type: string
        default: '6c836acd4b7d2c257d863dc4de537c5797773b88'

permissions:
  actions: read
  contents: read

jobs:
  runtime:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed runtime helper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: pipeline
          sparse-checkout: buildscripts/ci/fork
          persist-credentials: false

      - name: Checkout reviewed runtime fixtures
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: fixtures
          sparse-checkout: |
            /version.cmake
            /share/testflowscripts/TC11_CommandPaletteDialog.js
            /share/testflowscripts/TC14_CommandPaletteAnnounce.js
            /share/testflowscripts/TC15_RegionEntryAnnounce.js
            /vtest/scores/layout-5.mscx
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download immutable package bytes
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          artifact-ids: ${{ inputs.artifact_id }}
          path: package
          merge-multiple: true

      - name: Run bounded diagnostic and capture process snapshots
        shell: pwsh
        env:
          PACKAGE_RUN_ID: ${{ inputs.run_id }}
          PACKAGE_ARTIFACT_ID: ${{ inputs.artifact_id }}
          PACKAGE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnosticRoot = [IO.Path]::GetFullPath('diagnostic results')
          $helperRoot = Join-Path $diagnosticRoot 'helper'
          $processRoot = Join-Path $diagnosticRoot 'process'
          $profileRoot = Join-Path $diagnosticRoot 'profile'
          New-Item -ItemType Directory -Path $helperRoot, $processRoot, $profileRoot -Force | Out-Null

          $helper = [IO.Path]::GetFullPath('pipeline/buildscripts/ci/fork/test-windows-package.ps1')
          $artifactDirectory = [IO.Path]::GetFullPath('package')
          $sourceDirectory = [IO.Path]::GetFullPath('fixtures')
          $outputDirectory = [IO.Path]::GetFullPath('runtime results')
          $stdoutPath = Join-Path $helperRoot 'helper.stdout.log'
          $stderrPath = Join-Path $helperRoot 'helper.stderr.log'

          $startInfo = [Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = (Get-Command pwsh).Source
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          foreach ($argument in @(
              '-NoLogo',
              '-NoProfile',
              '-File', $helper,
              '-ArtifactDirectory', $artifactDirectory,
              '-SourceDirectory', $sourceDirectory,
              '-OutputDirectory', $outputDirectory,
              '-GuiTimeoutSeconds', '120')) {
            $startInfo.ArgumentList.Add($argument)
          }

          $helperProcess = [Diagnostics.Process]::new()
          $helperProcess.StartInfo = $startInfo
          $null = $helperProcess.Start()
          $helperStdoutTask = $helperProcess.StandardOutput.ReadToEndAsync()
          $helperStderrTask = $helperProcess.StandardError.ReadToEndAsync()

          $snapshotIndex = 0
          while (-not $helperProcess.HasExited) {
            $snapshotIndex++
            $snapshot = [ordered]@{
              captured_at_utc = [DateTime]::UtcNow.ToString('o')
              helper_pid = $helperProcess.Id
              processes = @(
                Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                  Select-Object ProcessId, ParentProcessId, Name, CommandLine, ExecutablePath, CreationDate
              )
            }
            $snapshotPath = Join-Path $processRoot ('process-{0:D3}.json' -f $snapshotIndex)
            $snapshot | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $snapshotPath -Encoding UTF8
            Start-Sleep -Seconds 10
            $helperProcess.Refresh()
          }

          $stdout = $helperStdoutTask.GetAwaiter().GetResult()
          $stderr = $helperStderrTask.GetAwaiter().GetResult()
          [IO.File]::WriteAllText($stdoutPath, $stdout, [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText($stderrPath, $stderr, [Text.UTF8Encoding]::new($false))
          $helperExitCode = $helperProcess.ExitCode
          [ordered]@{
            package_run_id = $env:PACKAGE_RUN_ID
            package_artifact_id = $env:PACKAGE_ARTIFACT_ID
            package_source_sha = $env:PACKAGE_SOURCE_SHA
            helper = $helper
            helper_arguments = @('-GuiTimeoutSeconds', '120')
            helper_exit_code = $helperExitCode
            captured_process_snapshots = $snapshotIndex
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $helperRoot 'diagnostic-command.json') -Encoding UTF8

          # The helper owns the profile path contract. Copy only this run's development profile,
          # including settings, logs, and persisted testflow data, after the bounded run completes.
          $profileName = 'MuseScoreStudio5Development'
          $roamingProfile = Join-Path $env:APPDATA ('MuseScore\{0}.ini' -f $profileName)
          $localProfile = Join-Path $env:LOCALAPPDATA ('MuseScore\{0}' -f $profileName)
          if (Test-Path -LiteralPath $roamingProfile -PathType Leaf) {
            Copy-Item -LiteralPath $roamingProfile -Destination (Join-Path $profileRoot 'AppData-Roaming-MuseScoreStudio5Development.ini') -Force
          }
          if (Test-Path -LiteralPath $localProfile -PathType Container) {
            Copy-Item -LiteralPath $localProfile -Destination (Join-Path $profileRoot 'AppData-Local-MuseScoreStudio5Development') -Recurse -Force
          }
          [ordered]@{
            roaming_profile = $roamingProfile
            local_profile = $localProfile
            roaming_profile_present = (Test-Path -LiteralPath $roamingProfile -PathType Leaf)
            local_profile_present = (Test-Path -LiteralPath $localProfile -PathType Container)
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $profileRoot 'profile-paths.json') -Encoding UTF8

          if ($helperExitCode -ne 0) {
            Write-Host "Diagnostic helper exited $helperExitCode"
            exit $helperExitCode
          }

      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-windows-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostic results
            runtime results
          if-no-files-found: warn
          retention-days: 14
